name: Patch between two builds (test)

# Test-only: packs just the files that differ between two Windows portable builds of this fork,
# so a tester who has the old one downloads a small artifact instead of the whole build.
on:
  push:
    branches:
      - wintest-patch

permissions:
  actions: read
  contents: read

jobs:
  patch:
    name: Pack changed files
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      OLD_RUN: "37146072634"
      NEW_RUN: "37157501249"
      ARTIFACT: OrcaSlicer_Windows_V2.5.0-dev_x64_portable
    steps:
      - name: Download both builds
        run: |
          gh run download "$OLD_RUN" -R "$GITHUB_REPOSITORY" -n "$ARTIFACT" -D old
          gh run download "$NEW_RUN" -R "$GITHUB_REPOSITORY" -n "$ARTIFACT" -D new
          du -sh old new

      - name: Collect changed files
        run: |
          mkdir patch
          cd new
          find . -type f | while IFS= read -r f; do
            if [ ! -f "../old/$f" ] || ! cmp -s "$f" "../old/$f"; then
              mkdir -p "../patch/$(dirname "$f")"
              cp "$f" "../patch/$f"
            fi
          done
          cd ../old
          find . -type f | while IFS= read -r f; do
            [ -f "../new/$f" ] || echo "$f"
          done > ../REMOVED_FILES.txt
          cd ..
          cp REMOVED_FILES.txt patch/
          echo "Changed or new files: $(find patch -type f | wc -l)"
          echo "Removed files: $(wc -l < REMOVED_FILES.txt)"
          du -sh patch
          find patch -type f -size +1M -exec ls -la {} \;
          find patch -type f | sort | head -100

      - name: Upload patch
        uses: actions/upload-artifact@v7
        with:
          name: OrcaSlicer_patch_changed_files
          path: patch
